services:
  postgres:
    image: postgres:18-alpine
    container_name: leonice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leonice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leonice}
      POSTGRES_DB: ${POSTGRES_DB:-leonice_spa}
      TZ: America/Bogota
    ports:
      - '5444:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-leonice}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: leonice-redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: development
    container_name: leonice-api
    restart: unless-stopped
    environment:
      TZ: America/Bogota
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: pnpm start:dev

volumes:
  postgres_data:
  redis_data:
